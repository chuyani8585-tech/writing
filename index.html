<p class="sub">把你的情緒描寫貼進來，電腦只會畫出你「寫到」的部位。寫得越具體，臉就越完整！</p>

</div>
</section><section id="m2" hidden><h2>情緒銜接模式：讓同一種情緒一步步堆疊起來</h2>
<div class="card"><div class="ex"><button id="nsc">🎲 抽一個情緒</button><button id="tsf">收起／展開鷹架</button></div><div id="sfb"></div></div>
<div class="card" style="margin-top:12px"><textarea id="t2" style="min-height:200px" placeholder="用一段文字，寫出這個情緒從開始、升高到頂點的過程。可以參考上面的鷹架，但不需要照著它的字詞寫。"></textarea><div class="chk" id="ck"></div></div>

<script>
let NEED=null,CUR=null;const DEG=c=>/微|稍|略|輕輕|些許|一點|半|淺/.test(c)?'s':/大|極|猛|圓|合不攏|瞪|瞠|最|高高|緊緊|死死|深|誇張|一條線|一條縫/.test(c)?'l':'m';const P=[
{id:'brow',n:'眉',core:1,k:/眉/,g:{shape:[[/斜挑|倒豎|橫眉|怒眉|吊|柳眉/,'slant'],[/皺|蹙|擰|擠|鎖|糾結/,'furrow'],[/八字|下垂|垂下|眉尾/,'worry'],[/低|壓|沉/,'low'],[/揚|挑|抬|聳|豎|高/,'raise']],jump:[[/跳|抽動|上下活動|迅速/,1]]}},
{id:'eye',n:'眼',core:1,k:/眼|睛|瞳|目|眸|淚|眶|瞪|瞇/,g:{shape:[[/閉上|闔|閉眼/,'closed'],[/瞪|睜|圓睜|大眼|張大/,'wide'],[/瞇|眯|半闔|細長|一條線/,'narrow'],[/低垂|垂下|垂眼|下垂/,'droop']],pupil:[[/瞳.{0,2}(放大|擴大|擴張|張大)/,'big'],[/瞳.{0,2}(縮|收|針)/,'small']],tear:[[/淚|哭|泣|濕潤/,1]],rim:[[/紅|血絲|充血/,1]]}},
{id:'nose',n:'鼻',core:1,k:/鼻/,g:{flare:[[/孔|翼|擴張|張大|煽|搧|噴/,1]],wr:[[/皺|縮|梁|扭曲/,1]],red:[[/紅|酸/,1]]}},
{id:'mouth',n:'嘴',core:1,k:/嘴|唇|口|牙|舌|齒|笑|咧/,g:{shape:[[/張|開|呆|合不攏|叫|喊|驚呼/,'open'],[/緊閉|抿|緊繃|咬|閉緊|閉上/,'press'],[/上揚|揚起|微笑|笑|咧|上翹|上彎/,'smile'],[/下垂|下撇|下彎|癟|撇|扁|下拉|向下|苦澀/,'frown']],teeth:[[/牙|齒|露/,1]],lip:[[/發白|蒼白|慘白|煞白/,'white'],[/發紫|青紫|烏紫|發青/,'purple'],[/紅|豔/,'red']]}},
{id:'oth',n:'臉色／其他',core:0,k:/臉|面色|頰|額|汗|顫|抖/,g:{blush:[[/紅|燙/,1]],pale:[[/蒼白|發白|慘白|煞白/,1]],sweat:[[/汗/,1]],lines:[[/紋|青筋/,1]],shk:[[/顫|抖/,1]],flush:[[/漲紅|通紅|脹紅|紅透/,1]],livid:[[/鐵青|發青|青白/,1]]}}];
function parse(t){const st={};P.forEach(p=>st[p.id]={here:0,h:{},l:[],c:{}});
t.split(/[，,。；;！!？?\n、]+/).map(s=>s.trim()).filter(Boolean).forEach(c=>P.forEach(p=>{if(!p.k.test(c))return;const s=st[p.id];let hit=0;
for(const g in p.g){for(const [re,v] of p.g[g]){if(re.test(c)){if(!s.h[g]){s.h[g]=v;s.c[g]=c.slice(0,14);hit=1;if(g==='shape')s.d=DEG(c)}break}}}
if(p.core)s.here=1;else if(hit)s.here=1;if(hit&&!s.l.includes(c))s.l.push(c.slice(0,14))}));return st}
const BR={none:[0,0,0],raise:[-14,-3,-5],low:[8,3,3],furrow:[6,9,-3],slant:[3,12,-8],worry:[-2,-10,6]};
function brow(sd,b){const k0={s:.5,m:1,l:1.4}[b.d||'m'];const [dy,i,o]=BR[b.h.shape||'none'].map(x=>x*k0);const ix=150+sd*(b.h.shape==='furrow'?10:15),ox=150+sd*65,yo=120+dy+o,yi=120+dy+i;
return `<path d="M${ox} ${yo}Q${(ox+ix)/2} ${(yo+yi)/2-7} ${ix} ${yi}" fill="none" stroke="#4a3426" stroke-width="5" stroke-linecap="round"/>`}
function eye(sd,e){const cx=150+sd*40,sh=e.h.shape;
if(sh==='closed')return `<path d="M${cx-20} 150Q${cx} 162 ${cx+20} 150" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>`;
const d=e.d||'m',ry=(sh==='wide'?{s:11,m:13,l:17}[d]:sh==='narrow'?{s:6,m:4,l:2.5}[d]:sh==='droop'?6:9);let pr=e.h.pupil==='big'?9:e.h.pupil==='small'?3:(sh==='wide'?5:6);pr=Math.min(pr,ry+1);
return `<g transform="rotate(${sh==='droop'?sd*8:0} ${cx} 150)">${e.h.rim?`<ellipse cx="${cx}" cy="150" rx="25" ry="${ry+7}" fill="#e5484d" opacity=".4"/>`:''}<ellipse cx="${cx}" cy="150" rx="20" ry="${ry}" fill="var(--eye)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="${cx}" cy="150" r="${Math.min(pr+4,ry)}" fill="#7a5230"/><circle cx="${cx}" cy="150" r="${pr}" fill="var(--ink)"/></g>`
+(e.h.tear?`<path d="M${cx+sd*6} ${150+ry+4}Q${cx+sd*10} ${150+ry+22} ${cx+sd*6} ${150+ry+34}" stroke="#3b9ae1" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="${cx+sd*6}" cy="${150+ry+38}" rx="4" ry="6" fill="#3b9ae1"/>`:'')}
function nose(n){let s=(n.h.red?`<circle cx="150" cy="203" r="10" fill="#e5484d" opacity=".5"/>`:'')+`<path d="M150 168L145 202Q150 208 158 202" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>`;
if(n.h.flare)s+=`<ellipse cx="136" cy="206" rx="7" ry="4" fill="var(--ink)"/><ellipse cx="164" cy="206" rx="7" ry="4" fill="var(--ink)"/><path d="M127 197Q122 208 132 213M173 197Q178 208 168 213" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;
else s+=`<circle cx="143" cy="205" r="2.5" fill="var(--ink)"/><circle cx="157" cy="205" r="2.5" fill="var(--ink)"/>`;
if(n.h.wr)s+=[170,177,184].map(y=>`<path d="M${138} ${y}Q150 ${y-4} 162 ${y}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>`).join('');return s}
function mouth(m){const L={white:'#cfcac4',purple:'#7a4a9a',red:'#d2434a'}[m.h.lip]||'#b4474a';return mouth0(m).replace(/stroke="var\(--ink\)" stroke-width="(4|3)"/g,'stroke="'+L+'" stroke-width="$1"')}
function mouth0(m){const sh=m.h.shape,te=m.h.teeth,k='fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"';
const T=`<rect x="122" y="244" width="56" height="14" rx="5" fill="#fff" stroke="var(--ink)" stroke-width="2.5"/>`+[136,150,164].map(x=>`<path d="M${x} 244V258" stroke="var(--ink)" stroke-width="1.5"/>`).join('');
if(sh==='open'){const [rx,ry]={s:[9,8],m:[14,16],l:[19,26]}[m.d||'m'],tt=254-ry+3,w=rx*.75;return `<ellipse cx="150" cy="254" rx="${rx}" ry="${ry}" fill="#5a1f1f" stroke="var(--ink)" stroke-width="3"/>`+(te?`<path d="M${150-w} ${tt+4}Q150 ${tt-2} ${150+w} ${tt+4}L${150+w} ${tt+10}Q150 ${tt+5} ${150-w} ${tt+10}Z" fill="#fff"/>`:'')}
if(sh==='smile')return te?`<path d="M112 244Q150 250 188 244Q150 290 112 244Z" fill="#fff" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>`:`<path d="M115 244Q150 ${{s:258,m:276,l:292}[m.d||'m']} 185 244" ${k}/>`;
if(sh==='frown'){const q={s:[262,250],m:[264,236],l:[268,226]}[m.d||'m'];return `<path d="M118 ${q[0]}Q150 ${q[1]} 182 ${q[0]}" ${k}/>`}
if(te)return T;return `<path d="M122 252H178" ${k} ${sh==='press'?'':'stroke-width="3"'}/>`}
function ph(t,x,y,d){return `<g opacity=".7"><path d="${d}" fill="none" stroke="var(--mute)" stroke-width="2.5" stroke-dasharray="5 5"/><text x="${x}" y="${y}" text-anchor="middle" font-size="15" fill="var(--mute)">${t}</text></g>`}
function draw(st,nd){const w=i=>!nd||nd.includes(i),o=st.oth.h;let s=`<g class="${o.shk?'shk':''}"><ellipse cx="150" cy="172" rx="102" ry="132" fill="${o.livid?'#9fb9a9':o.pale?'var(--pale)':o.flush?'#e8907f':'var(--skin)'}" stroke="var(--ink)" stroke-width="3"/>`;
if(o.blush)s+=`<circle cx="82" cy="206" r="20" fill="#e5484d" opacity=".35"/><circle cx="218" cy="206" r="20" fill="#e5484d" opacity=".35"/>`;
if(o.lines)s+=[78,89,100].map(y=>`<path d="M110 ${y}Q130 ${y-6} 150 ${y}T190 ${y}" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".6"/>`).join('');

const EX=['眉頭緊皺，眉毛斜挑壓低。雙眼圓睜，瞳孔縮小。鼻孔擴張，鼻梁皺起。嘴唇緊閉，咬緊牙關，額頭浮現青筋，臉漲得通紅。','眉毛高高揚起，眼睛睜得大大的，瞳孔放大。嘴巴張得合不攏，臉色發白，額頭冒出冷汗。','眉尾下垂，眼眶泛紅，淚水滑落。鼻頭皺起。嘴角下垂，嘴唇顫抖。','眉毛微微上揚，眼睛瞇成一條線。嘴角上揚，咧嘴露出牙齒，雙頰泛紅。'];
const $=i=>document.getElementById(i),t=$('t');
const FIT={快樂:{brow:{shape:['raise']},eye:{shape:['narrow','closed'],pupil:['big']},mouth:{shape:['smile'],teeth:[1]},oth:{blush:[1]}},驚訝:{brow:{shape:['raise']},eye:{shape:['wide'],pupil:['big']},mouth:{shape:['open']},oth:{pale:[1],sweat:[1]}},恐懼:{brow:{shape:['raise','worry']},eye:{shape:['wide'],pupil:['big'],tear:[1]},mouth:{shape:['open','press'],lip:['white','purple']},oth:{pale:[1],sweat:[1],shk:[1]}},厭惡:{brow:{shape:['low','furrow']},eye:{shape:['narrow']},nose:{wr:[1],flare:[1]},mouth:{shape:['frown','press']}},憤怒:{brow:{shape:['furrow','slant','low']},eye:{shape:['wide','narrow'],pupil:['small'],rim:[1]},nose:{flare:[1],wr:[1]},mouth:{shape:['press','open'],teeth:[1]},oth:{blush:[1],flush:[1],lines:[1],shk:[1]}},悲傷:{brow:{shape:['worry','low']},eye:{shape:['droop','closed'],tear:[1],rim:[1]},nose:{red:[1],wr:[1]},mouth:{shape:['frown']},oth:{shk:[1],pale:[1]}}};
function ev(st,e){const r={fit:{},bad:[]};for(const p of P){const s=st[p.id],f=(FIT[e]||{})[p.id];r.fit[p.id]=0;for(const g in s.h){const v=s.h[g];if(f&&f[g]){if(f[g].includes(v))r.fit[p.id]++;else r.bad.push(s.c[g])}else if(!f&&p.core)r.bad.push(s.c[g])}}return r}
